name: Validate question bank

on:
  push:
    paths: ["data/**", "tools/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "tools/**", ".github/workflows/validate.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check questions and run every coding task's tests
        run: python tools/validate_bank.py
